name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Aceptar licencias del SDK (el runner ya trae el SDK de Android)
        run: yes | sdkmanager --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Compilar APK (debug)
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: roomba-local-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "roomba-local-$TAG.apk"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "roomba-local-$TAG.apk" --clobber
          else
            gh release create "$TAG" "roomba-local-$TAG.apk" \
              --title "Roomba Local $TAG" \
              --notes "APK listo para instalar en Android. Descárgalo desde Assets, instálalo permitiendo orígenes desconocidos y sigue el README para configurarlo."
          fi

      - name: Publicar versión nueva (cada subida a main, sin borrar las anteriores)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          BUILD=${{ github.run_number }}
          TAG="v$VERSION-b$BUILD"
          APK="roomba-local-$VERSION-b$BUILD.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          MSG=$(git log -1 --pretty=%s)
          gh release create "$TAG" "$APK" \
            --target "$GITHUB_SHA" \
            --latest \
            --title "Roomba Local $VERSION (build $BUILD)" \
            --notes "Cambios: $MSG

          Descarga el APK desde Assets e instálalo encima de la versión anterior. Las versiones antiguas siguen disponibles en Releases."
