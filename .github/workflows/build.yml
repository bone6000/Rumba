name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Aceptar licencias del SDK (el runner ya trae el SDK de Android)
        run: yes | sdkmanager --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Compilar APK (debug)
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: roomba-local-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "roomba-local-$TAG.apk"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "roomba-local-$TAG.apk" --clobber
          else
            gh release create "$TAG" "roomba-local-$TAG.apk" \
              --title "Roomba Local $TAG" \
              --notes "APK listo para instalar en Android. Descárgalo desde Assets, instálalo permitiendo orígenes desconocidos y sigue el README para configurarlo."
          fi

      - name: Publicar release "latest" (cada subida a main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk roomba-local.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest roomba-local.apk \
            --target "$GITHUB_SHA" \
            --title "Roomba Local (última versión)" \
            --notes "APK de la última versión de main. Descárgalo desde Assets, instálalo permitiendo orígenes desconocidos y sigue el README para configurarlo. Se actualiza solo con cada cambio."
